name: Build and Release VSIX (Stable Tag)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: vsix-release-stable
  cancel-in-progress: true

jobs:
  release-stable:
    runs-on: windows-latest

    env:
      PROJECT_PATH: AzureOpenAI.Vsix/AzureOpenAI.Vsix.csproj
      VSIX_PATH: AzureOpenAI.Vsix/bin/Release/AzureOpenAIChat.vsix
      MANIFEST_PATH: AzureOpenAI.Vsix/source.extension.vsixmanifest
      STABLE_TAG: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:PROJECT_PATH

      - name: Build VSIX (Release)
        shell: pwsh
        run: |
          dotnet msbuild $env:PROJECT_PATH /t:Rebuild /p:Configuration=Release /nologo
          if (!(Test-Path $env:VSIX_PATH)) {
            throw "VSIX not found: $env:VSIX_PATH"
          }

      - name: Resolve manifest version
        id: meta
        shell: pwsh
        run: |
          [xml]$xml = Get-Content $env:MANIFEST_PATH -Raw
          $nsmgr = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $nsmgr.AddNamespace("x", "http://schemas.microsoft.com/developer/vsx-schema/2011")
          $version = $xml.SelectSingleNode("//x:Identity", $nsmgr).Version
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compose release notes (PR description preferred)
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { owner, repo } = context.repo;
            let body = "";

            try {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });

              if (prs.data?.length > 0) {
                const pr = prs.data[0];
                body = [
                  "### 最近一次合并到 main 的 PR",
                  `- #${pr.number} ${pr.title}`,
                  "",
                  pr.body?.trim() || "_该 PR 未填写描述_",
                  "",
                  `Commit: ${sha}`,
                ].join("\n");
              }
            } catch (e) {
              core.info(`读取关联 PR 失败，回退 commit message。原因: ${e.message}`);
            }

            if (!body) {
              const message =
                context.payload.head_commit?.message ||
                (await github.rest.repos.getCommit({ owner, repo, ref: sha })).data.commit.message;

              body = [
                "### 最近一次 main 提交说明",
                "",
                "```text",
                message,
                "```",
                "",
                `Commit: ${sha}`,
              ].join("\n");
            }

            core.setOutput("body", body);

      - name: Move stable tag to current main commit
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ env.STABLE_TAG }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const tagRef = `tags/${process.env.TAG_NAME}`;

            try {
              await github.rest.git.getRef({ owner, repo, ref: tagRef });
              await github.rest.git.updateRef({ owner, repo, ref: tagRef, sha, force: true });
              core.info(`Updated tag ${tagRef} -> ${sha}`);
            } catch (e) {
              if (e.status === 404) {
                await github.rest.git.createRef({ owner, repo, ref: `refs/${tagRef}`, sha });
                core.info(`Created tag ${tagRef} -> ${sha}`);
              } else {
                throw e;
              }
            }

      - name: Create/Update stable release and upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STABLE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Azure OpenAI Chat ${{ steps.meta.outputs.version }}
          body: |
            ${{ steps.notes.outputs.body }}

            ---
            VSIX 版本: `${{ steps.meta.outputs.version }}`
            构建配置: Release
            分支: main
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            ${{ env.VSIX_PATH }}

